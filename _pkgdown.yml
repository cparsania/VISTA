url: https://cparsania.github.io/VISTA/
template:
  bootstrap: 5

navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, github]

articles:
  - title: Workflows
    navbar: Articles
    contents:
      - VISTA-airway
      - workflows/VISTA-comparison
      - workflows/VISTA-code-economy
      - workflows/VISTA-deconvolution
  - title: Visualization Guides
    contents:
      - guides/VISTA-input-preparation
      - guides/VISTA-chord
      - guides/VISTA-raincloud
      - guides/VISTA-colors
reference:
  - title: "VISTA Class & Constructors"
    desc: >
      Create and manage VISTA objects for differential expression analysis.
    contents:
      - VISTA-class
      - create_vista
      - as_vista
      - run_deseq_analysis
      - run_edger_analysis
      - run_limma_analysis
      - set_rowdata
      - print.VISTA

  - title: "Object Methods"
    desc: >
      Bioconductor methods a VISTA object supports: display, subsetting,
      schema migration, and hand-off to DESeq2.
    contents:
      - VISTA-show
      - VISTA-subset
      - updateObject,VISTA-method
      - as_deseq_dataset

  - title: "Accessor Functions"
    desc: >
      Extract components from a VISTA object.
    contents:
      - VISTA-accessors
      - comparisons
      - deg_summary
      - cutoffs
      - norm_counts
      - counts
      - row_data
      - group_colors
      - group_palette
      - set_de_source
      - set_vista_group_colors
      - set_vista_comparison_colors

  - title: "Input Preparation"
    desc: >
      Standardize count matrices and sample metadata before constructing a VISTA object.
    contents:
      - read_vista_counts
      - derive_vista_metadata
      - read_vista_metadata
      - match_vista_inputs

  - title: "Quality Control Plots"
    desc: >
      Sample-level quality control and exploratory visualizations.
    contents:
      - get_pca_plot
      - get_mds_plot
      - get_umap_plot
      - get_corr_heatmap
      - get_pairwise_corr_plot

  - title: "Differential Expression Plots"
    desc: >
      Visualize differential expression results across comparisons.
    contents:
      - get_volcano_plot
      - get_ma_plot
      - get_deg_count_barplot
      - get_deg_count_pieplot
      - get_deg_count_donutplot
      - get_deg_venn_diagram
      - get_deg_alluvial
      - get_genes_by_regulation

  - title: "Expression Plots"
    desc: >
      Visualize gene expression patterns across samples and groups.
    contents:
      - get_expression_heatmap
      - get_expression_barplot
      - get_expression_boxplot
      - get_expression_violinplot
      - get_expression_density
      - get_expression_scatter
      - get_expression_lineplot
      - get_expression_lollipop
      - get_expression_joyplot
      - get_expression_raincloud
      - get_expression_matrix
      - get_expression_chromosome_plot

  - title: "Fold-Change Plots"
    desc: >
      Visualize and compare log2 fold-changes across comparisons.
    contents:
      - get_foldchange_heatmap
      - get_foldchange_scatter
      - get_foldchange_barplot
      - get_foldchange_boxplot
      - get_foldchange_raincloud
      - get_foldchange_lineplot
      - get_foldchange_lollipop
      - get_foldchange_matrix
      - get_foldchange_chromosome_plot

  - title: "Functional Enrichment"
    desc: >
      Gene set enrichment and pathway analysis.
    contents:
      - get_msigdb_enrichment
      - get_go_enrichment
      - get_kegg_enrichment
      - get_gsea
      - enrichMsigDB
      - get_enrichment_plot
      - get_pathway_genes
      - get_pathway_heatmap
      - get_enrichment_chord

  - title: "Cell-Type Deconvolution"
    desc: >
      Estimate and visualize cell-type composition from bulk RNA-seq.
    contents:
      - run_cell_deconvolution
      - get_cell_fractions
      - get_celltype_barplot
      - get_celltype_group_dotplot
      - get_celltype_heatmap

  - title: "Reporting"
    desc: >
      Generate automated analysis reports.
    contents:
      - run_vista_report

  - title: "Validation & Benchmarking"
    desc: >
      Verify VISTA objects and benchmark backend fidelity against standalone workflows.
    contents:
      - validate_vista
      - validate_vista_deep
      - benchmark_vista_equivalence

  - title: "Exporting"
    desc: >
      Save publication-ready plots, tables, and reproducible asset bundles.
    contents:
      - save_vista_plot
      - save_vista_data
      - export_vista_assets

  - title: "Example Data"
    desc: >
      Built-in datasets for examples and testing.
    contents:
      - example_vista
      - count_data
      - sample_metadata

  - title: "Deprecated"
    desc: >
      Renamed arguments that still work, and the release each becomes defunct in.
    contents:
      - VISTA-deprecated
